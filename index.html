header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:6px 0 18px}.hr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ct{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 4px 3px 12px}.pn{background:none;border:0;color:var(--ink);font:inherit;font-size:14px;cursor:pointer;direction:ltr;padding:0}.ic{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;color:#fff}.ic svg{width:16px;height:16px;fill:currentColor}.ic.wa{background:#1fa855}.ic.tg{background:#229ed9}.ic.off{opacity:.4;pointer-events:none}

.card.off{cursor:default}.card+.card{margin-top:10px}.st{font-size:14px;font-weight:600;padding:3px 12px;border-radius:20px;white-space:nowrap}.st.go{background:var(--acc);color:var(--bg)}.st.soon{background:var(--warnbg);color:var(--warn)}details.g{background:color-mix(in srgb,var(--c) 12%,var(--card));border:1px solid var(--c);border-inline-start-width:6px;border-radius:14px;margin-bottom:12px;padding:0 14px}details.g.a{--c:#0e7c86}details.g.b{--c:#7a5fd0}details.g.c{--c:#4f8a2b}details.g.d{--c:#c23d6b}details.g.e{--c:#2f6fa8}details.g .st.go{background:var(--c);color:#fff}details.g summary{cursor:pointer;padding:14px 2px;font-weight:600;font-size:18px}details.g .card{margin:0 0 10px;background:var(--bg);border-color:var(--c)}h4{margin:16px 0 8px;font-size:15px;color:var(--mute)}.about{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}.ph{width:170px;height:170px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 14px;border:3px solid var(--acc)}.bio h2{font-size:20px;margin:4px 0 6px}.bio ul{list-style:none;padding:0;margin:0}.bio li{margin:3px 0;font-size:16px}.bio+.bio{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.about{margin-bottom:8px}@media(min-width:560px){.about{display:grid;grid-template-columns:180px 1fr;gap:18px;align-items:start}.ph{margin:0}}.dr{color:var(--acc)}.dr span{display:block;font:600 58px/1.1 'Readex Pro',sans-serif;letter-spacing:.03em}.dr svg{width:210px;height:22px;display:block;margin-top:6px}

const B12=[{"n":1,"q":"A 22-year-old soccer player sees the ball approaching. Her brain analyzes its speed and path, compares it with stored experience, and selects the decision to kick. Which nervous system function is performed by the brain in this step?","o":["Sensory","Integrative","Motor","Effector"],"a":1},{"n":2,"q":"A 55-year-old farmer exposed to an industrial toxin develops chromatolysis: the granular basophilic clumps (Nissl bodies) disappear from his neuron cell bodies. Which process will be most directly impaired?","o":["Anaerobic glycolysis","Resting ion pumping","Rough ER-dependent protein synthesis","Neurotransmitter release at axon terminals"],"a":2},{"n":3,"q":"A drug disrupts the neurofibrils (intermediate cytoskeleton) of neuronal cell bodies. What is the most likely cellular consequence?","o":["Loss of the neuron's shape and structural support","Failure of protein synthesis","Failure of the Na⁺/K⁺ pump","Loss of the myelin sheath"],"a":0},{"n":4,"q":"A tumor compresses the axon hillock (trigger zone) of a motor neuron. Recording shows normal graded potentials in the dendrites, yet no impulse travels down the axon. Which interpretation is correct?","o":["Dendrites cannot generate graded potentials","Nissl bodies have been destroyed","Neurotransmitters can no longer be synthesized","Graded potentials occur but are not converted into action potentials"],"a":3},{"n":5,"q":"A retinal biopsy shows a neuron with one main dendrite and one axon extending from opposite sides of the cell body. Which structural type is this?","o":["Pseudounipolar","Multipolar","Bipolar","Anaxonic"],"a":2},{"n":6,"q":"A patient steps on a pin and feels sharp pain in the foot. The neuron that carried this information to the spinal cord is best classified as:","o":["Afferent, unipolar (pseudounipolar)","Efferent, multipolar","Afferent, multipolar","Interneuron, bipolar"],"a":0},{"n":7,"q":"A neuron has its cell body in the anterior gray horn of the spinal cord, and its axon leaves to innervate the quadriceps muscle. This neuron is:","o":["Afferent, unipolar","Afferent, bipolar","Efferent, bipolar","Efferent, multipolar"],"a":3},{"n":8,"q":"A pathologist examining brain and spinal cord tissue notes that the large majority of neurons have many dendrites and a single axon. These neurons are:","o":["Unipolar","Multipolar","Bipolar","Pseudounipolar"],"a":1},{"n":9,"q":"A 28-year-old woman presents with visual loss and limb weakness. MRI shows plaques of demyelination in the brain and spinal cord (multiple sclerosis). Which cells are the direct target of the autoimmune attack?","o":["Schwann cells","Astrocytes","Oligodendrocytes","Satellite cells"],"a":2},{"n":10,"q":"Two weeks after a viral infection, a 35-year-old man develops ascending weakness. Nerve conduction studies show demyelination of peripheral nerves (Guillain-Barré syndrome). Which cells normally form the damaged myelin?","o":["Schwann cells","Oligodendrocytes","Microglia","Ependymal cells"],"a":0},{"n":11,"q":"A patient with bacterial infection of brain tissue has debris from dead neurons and bacteria in the affected area. Which CNS cells would engulf this material?","o":["Astrocytes","Oligodendrocytes","Ependymal cells","Microglia"],"a":3},{"n":12,"q":"A newborn has hydrocephalus caused by defective cilia on the cells lining the cerebral ventricles and the central canal. Which cells are abnormal?","o":["Astrocytes","Ependymal cells","Satellite cells","Microglia"],"a":1},{"n":13,"q":"After head trauma, the blood-brain barrier is disrupted and extracellular K⁺ rises around neurons. Which cell normally forms the barrier and removes excess K⁺?","o":["Astrocytes","Microglia","Oligodendrocytes","Ependymal cells"],"a":0},{"n":14,"q":"A carpenter has a crush injury to the ulnar nerve and later recovers function, while a patient with a spinal cord injury shows poor axon regeneration. Which cell mainly supports the regeneration in the first patient?","o":["Oligodendrocyte","Astrocyte","Schwann cell","Microglia"],"a":2},{"n":15,"q":"Herpes zoster virus lies dormant in a dorsal root ganglion. Flat cells that surround the neuron cell bodies there, supporting them and regulating exchange with interstitial fluid, are:","o":["Schwann cells","Astrocytes","Ependymal cells","Satellite cells"],"a":3},{"n":16,"q":"A medical student labels a diagram of neuroglia. How many types of neuroglia are found in the CNS and in the PNS, respectively?","o":["2 and 4","4 and 2","3 and 3","6 and 0"],"a":1},{"n":17,"q":"A 60-year-old man is diagnosed with a glioma (a tumor of supporting cells), whereas primary tumors of mature neurons are rare. Which statement best explains this?","o":["Neuroglia are not electrically excitable and retain the ability to divide, unlike mature neurons","Neuroglia generate action potentials and divide rapidly","Neuroglia make up only about 10% of nervous tissue","Neuroglia are present only in the PNS"],"a":0},{"n":18,"q":"A researcher compares myelination in the CNS and PNS. Which statement is correct?","o":["Astrocytes form myelin in both CNS and PNS","Oligodendrocytes myelinate axons of the PNS","One oligodendrocyte can myelinate segments of several CNS axons, whereas one Schwann cell myelinates a segment of a single axon","One Schwann cell wraps many different PNS axons at the same time"],"a":2},{"n":19,"q":"An MRI shows a small lesion in a cluster of neuronal cell bodies deep within the brain. This cluster is called a:","o":["Ganglion","Tract","Nerve","Nucleus"],"a":3},{"n":20,"q":"A stab wound to the forearm severs a bundle of axons located outside the CNS. This structure is a:","o":["Nerve","Tract","Ganglion","Nucleus"],"a":0},{"n":21,"q":"A pathologist describes the composition of gray matter. Which of the following is NOT a main component of gray matter?","o":["Neuron cell bodies","Dendrites and unmyelinated axons","Bundles of myelinated axons","Neuroglia"],"a":2},{"n":22,"q":"A neurophysiologist compares conduction velocity in four axons, all at normal body temperature unless stated. Which axon conducts impulses fastest?","o":["Thin, unmyelinated axon","Thick, myelinated axon","Thick, unmyelinated axon","Thick, myelinated axon cooled to 30°C"],"a":1},{"n":23,"q":"A mountain climber with severe hypothermia shows slowed nerve conduction. Which explanation is correct?","o":["Temperature has no effect on propagation","Cooling increases myelination","Cooling increases the number of Na⁺ channels","Lower temperature decreases the speed of action potential propagation"],"a":3},{"n":24,"q":"A physiology exam asks which of the following does NOT contribute to the resting membrane potential of a neuron. The correct answer is:","o":["Opening of voltage-gated Na⁺ channels","Inability of most intracellular anions to leave the cell","Electrogenic activity of the Na⁺/K⁺ ATPase","Unequal distribution of ions across the membrane"],"a":0},{"n":25,"q":"Ouabain, a Na⁺/K⁺ ATPase inhibitor, is applied to a neuron. What is the expected long-term effect?","o":["Immediate depolarization to +30 mV","Permanent hyperpolarization","Gradual dissipation of ion gradients and loss of the resting potential","No change, because leak channels maintain the gradients"],"a":2},{"n":26,"q":"The resting potential of a neuron (−70 mV) is much closer to the K⁺ equilibrium potential than to the Na⁺ equilibrium potential. The main reason is:","o":["The Na⁺/K⁺ pump moves 3 K⁺ into the cell per cycle","There are more K⁺ leak channels than Na⁺ leak channels, so the membrane is more permeable to K⁺","Most anions leave the cell easily","Cl⁻ channels dominate the resting membrane"],"a":1},{"n":27,"q":"At a neuromuscular junction, acetylcholine binds a ligand-gated channel that allows Na⁺ to enter the cell. The immediate result is:","o":["A hyperpolarizing graded potential","A guaranteed action potential","Repolarization","A depolarizing graded potential"],"a":3},{"n":28,"q":"Strychnine poisoning causes convulsions by blocking glycine receptors (ligand-gated Cl⁻ channels). Normally, glycine binding produces:","o":["A hyperpolarizing graded potential","A depolarizing graded potential","An action potential","Increased excitability of the neuron"],"a":0},{"n":29,"q":"A pen pressed against the fingertip is first detected when which type of channel opens in the sensory receptor?","o":["Voltage-gated Na⁺ channel","Ligand-gated channel","Mechanically-gated channel","Leak channel"],"a":2},{"n":30,"q":"Which statement correctly compares graded potentials (GPs) and action potentials (APs)?","o":["GPs are all-or-none, and APs vary in size","GPs vary in amplitude and spread only short distances, whereas APs are all-or-none and do not decay","APs decay with distance, and GPs do not","APs arise only from ligand-gated channels"],"a":1},{"n":31,"q":"Threshold of a neuron is −55 mV. A stimulus depolarizes the membrane from −70 mV to −60 mV. What happens?","o":["A full action potential","An action potential of reduced amplitude","Hyperpolarization","A local graded depolarization only, with no action potential"],"a":3},{"n":32,"q":"At threshold (−55 mV) in the axon, which event occurs?","o":["Voltage-gated Na⁺ channel activation gates open","Voltage-gated K⁺ channels open","Na⁺ inactivation gates close","The Na⁺/K⁺ pump stops"],"a":0},{"n":33,"q":"At the +30 mV peak of an action potential, which events begin the repolarizing phase?","o":["Na⁺ activation gates open further","K⁺ channels close and Na⁺ inactivation gates open","Na⁺ inactivation gates close and voltage-gated K⁺ channels open","The Na⁺/K⁺ pump reverses direction"],"a":2},{"n":34,"q":"On an action potential recording, the membrane briefly becomes more negative than −70 mV before returning to rest (after-hyperpolarization). This occurs because:","o":["Na⁺ channels remain open","Voltage-gated K⁺ channels are still open","The Na⁺/K⁺ pump reverses","Cl⁻ rushes into the cell"],"a":1},{"n":35,"q":"A local anesthetic blocks voltage-gated Na⁺ channels in a sensory axon. Which part of the action potential is prevented?","o":["Repolarization","The resting potential","K⁺ leak","The depolarizing phase, due to loss of Na⁺ influx"],"a":3},{"n":36,"q":"A toxin blocks voltage-gated K⁺ channels in an axon, but Na⁺ channels work normally. What is the expected effect?","o":["Delayed and prolonged repolarization","No depolarization","Failure to reach threshold","Loss of Na⁺ inactivation"],"a":0},{"n":37,"q":"During the absolute refractory period, a second, very strong stimulus cannot produce another action potential because:","o":["K⁺ channels are closed","The membrane is hyperpolarized","Na⁺ channels are open or inactivated and cannot be reactivated","The Na⁺/K⁺ pump is inactive"],"a":2},{"n":38,"q":"During the relative refractory period, a stronger-than-normal stimulus can trigger a new action potential because:","o":["Na⁺ inactivation gates are still closed","Na⁺ channels have returned to the resting state while K⁺ channels are still open","All Na⁺ activation gates are open","The membrane is at +30 mV"],"a":1},{"n":39,"q":"An action potential is generated in the sciatic nerve of a tall man and travels about 1 meter to the foot. Compared with its amplitude at the start, its amplitude at the end is:","o":["Progressively smaller","Larger","Reversed in polarity","The same, because action potentials do not die out"],"a":3},{"n":40,"q":"Two unmyelinated axons of 20 µm and 2 µm diameter are stimulated identically. Which statement is correct?","o":["The 20 µm axon conducts faster","The two conduct at equal speed","The 2 µm axon conducts faster","The 20 µm axon cannot conduct"],"a":0},{"n":41,"q":"Which event produces a hyperpolarizing graded potential?","o":["Na⁺ entry through ligand-gated channels","Ca²⁺ entry","Cl⁻ entry or K⁺ exit","Inhibition of the Na⁺/K⁺ pump"],"a":2},{"n":42,"q":"Botulinum toxin prevents neurotransmitter release from axon terminals. Which is the expected result?","o":["Action potentials fail to propagate along the axon","The action potential reaches the terminal, but synaptic transmission fails","Dendrites cannot generate graded potentials","The axon hillock is blocked"],"a":1},{"n":43,"q":"Which statement about a synapse is correct?","o":["The postsynaptic cell releases neurotransmitter into the cleft","Dendrites of the presynaptic cell contain the neurotransmitter vesicles","The synaptic cleft is filled with myelin","The presynaptic axon terminal releases neurotransmitter into the synaptic cleft"],"a":3},{"n":44,"q":"A student lists functions of astrocytes. Which of the following is NOT one of them?","o":["Forming the myelin sheath around CNS axons","Forming the blood-brain barrier","Regulating extracellular K⁺","Anchoring neurons to blood vessels"],"a":0},{"n":45,"q":"Which description fits ependymal cells?","o":["Phagocytes of the CNS","Myelinate CNS axons","Line the ventricles and central canal; cilia circulate CSF","Surround neuron cell bodies in ganglia"],"a":2},{"n":46,"q":"Which pair is correctly matched?","o":["Schwann cell – CNS myelin","Microglia – phagocytosis in the CNS","Satellite cell – myelin formation","Oligodendrocyte – PNS myelin"],"a":1},{"n":47,"q":"A patient feels touch, pain, pressure, and temperature on the skin. In the unipolar neurons that carry these sensations, the dendrites function as:","o":["Axon terminals","Trigger zones","Motor effectors","Sensory receptors"],"a":3},{"n":48,"q":"A stroke patient permanently loses neurons in an area of the brain, and they are generally not replaced. This is related to the fact that mature neurons:","o":["Lack centrioles and are generally amitotic","Cannot synthesize proteins","Cannot generate action potentials","Cannot form synapses"],"a":0},{"n":49,"q":"Which sequence correctly orders the events of a nerve action potential?","o":["Resting → K⁺ efflux → Na⁺ influx → threshold","Resting → threshold → Na⁺ influx (depolarization) → K⁺ efflux (repolarization) → return to resting","Resting → Na⁺ inactivation → threshold → depolarization","Resting → K⁺ influx → Na⁺ efflux → threshold"],"a":1},{"n":50,"q":"A man picks up a pen and writes. What is the FIRST electrical event in the sensory pathway?","o":["Nerve action potential in the sensory neuron","Muscle action potential at the neuromuscular junction","A graded potential in the sensory receptor","Nerve action potential in the lower motor neuron"],"a":2}];
const B11=[{"n":1,"q":"During a rehabilitation session, a patient is asked to perform a movement in which one bone moves toward another across a joint. The muscle responsible has an attachment on the relatively stationary bone and another on the moving bone. Which statement correctly identifies these attachments?","o":["Insertion is attached to the stationary bone, while origin is attached to the moving bone.","Both origin and insertion are attached to the moving bone.","Origin is attached to the stationary bone, while insertion is attached to the moving bone.","Origin and insertion are interchangeable terms."],"a":2},{"n":2,"q":"A patient requires a muscle capable of generating considerable force over a relatively limited range of motion. Histological examination reveals short fascicles attaching obliquely to a centrally positioned tendon on both sides. Which arrangement is most likely?","o":["Unipennate","Bipennate","Parallel","Fusiform"],"a":1},{"n":3,"q":"A surgeon examines a muscle whose fascicles originate from a broad area and converge toward a thick central tendon, producing a triangular appearance. Which muscle arrangement does this describe?","o":["Circular","Fusiform","Triangular","Multipennate"],"a":2},{"n":4,"q":"A patient has difficulty maintaining precise joint movement because an assisting muscle normally prevents unwanted movement produced by the prime mover. Which functional muscle group is impaired?","o":["Antagonists","Synergists","Prime movers","Circular muscles"],"a":1},{"n":5,"q":"During examination, a muscle is found to consist of fascicles arranged in concentric circles around an opening. Its contraction reduces the diameter of that opening. Which muscle arrangement is present?","o":["Parallel","Triangular","Circular","Multipennate"],"a":2},{"n":6,"q":"A muscle specimen demonstrates fascicles arranged on only one side of a tendon. Which muscle would be the most appropriate anatomical example?","o":["Rectus femoris","Deltoid","Extensor digitorum longus","Pectoralis major"],"a":2},{"n":7,"q":"An anatomist identifies a muscle with fascicles attaching obliquely from several directions to multiple tendons. Which arrangement is most likely?","o":["Bipennate","Multipennate","Unipennate","Fusiform"],"a":1},{"n":8,"q":"During a naming exercise, a student identifies a muscle whose fascicles run perpendicular to the body's midline. Which naming term best describes its orientation?","o":["Rectus","Oblique","Transverse","Longus"],"a":2},{"n":9,"q":"A patient has weakness in the muscle responsible for moving a body part away from the midline. Based on the muscle's functional name, which action is affected?","o":["Adduction","Abduction","Depression","Extension"],"a":1},{"n":10,"q":"A surgeon identifies a muscle with three tendons of origin. Which naming prefix would be most appropriate?","o":["Biceps","Quadriceps","Triceps","Maximus"],"a":2},{"n":11,"q":"A patient recovering from facial nerve injury cannot compress the cheeks against the teeth while attempting to whistle. Food also accumulates between the cheeks and teeth during chewing. Which muscle is most likely affected?","o":["Orbicularis oris","Buccinator","Zygomaticus major","Masseter"],"a":1},{"n":12,"q":"A patient can close the eyes normally but cannot voluntarily close the lips or protrude them during speech. Which muscle is most likely impaired?","o":["Orbicularis oculi","Buccinator","Orbicularis oris","Zygomaticus minor"],"a":2},{"n":13,"q":"Following a facial injury, a patient cannot elevate the angle of the mouth superiorly and laterally when smiling. Which muscle is most likely damaged?","o":["Zygomaticus major","Zygomaticus minor","Platysma","Buccinator"],"a":0},{"n":14,"q":"A patient can elevate the upper lip and expose the maxillary teeth but has difficulty producing a broad lateral smile. Which muscle is most likely functioning?","o":["Zygomaticus major","Zygomaticus minor","Orbicularis oris","Platysma"],"a":1},{"n":15,"q":"A patient has difficulty producing a pouting facial expression because the outer part of the lower lip cannot be drawn inferiorly and posteriorly. Which muscle is involved?","o":["Buccinator","Platysma","Orbicularis oculi","Zygomaticus major"],"a":1},{"n":16,"q":"A patient presents with an inability to close the eyelids tightly following a nerve injury. The affected muscle normally surrounds the orbit in a circular arrangement. Which nerve supplies it?","o":["Mandibular division of trigeminal nerve","Facial nerve","Accessory nerve","Oculomotor nerve"],"a":1},{"n":17,"q":"A patient has difficulty elevating the upper eyelid despite intact eye movements. The muscle involved passes its tendon over the eyeball before inserting into the upper eyelid. Identify the muscle.","o":["Orbicularis oculi","Levator palpebrae superioris","Temporalis","Zygomaticus minor"],"a":1},{"n":18,"q":"A patient experiences weakness when closing the jaw against resistance. The muscle responsible originates from the maxilla and zygomatic arch and inserts into the angle and ramus of the mandible. Which muscle is involved?","o":["Lateral pterygoid","Temporalis","Masseter","Medial pterygoid"],"a":2},{"n":19,"q":"During a clinical examination, a patient can elevate the mandible but has difficulty retracting it. Which muscle's impaired action best explains this finding?","o":["Lateral pterygoid","Temporalis","Buccinator","Platysma"],"a":1},{"n":20,"q":"A patient has difficulty protruding the mandible and moving it from side to side. Which muscle contributes to both actions and also assists in opening the mouth?","o":["Masseter","Temporalis","Lateral pterygoid","Orbicularis oris"],"a":2},{"n":21,"q":"A patient has weakness in a muscle that elevates and protracts the mandible while contributing to side-to-side movements during chewing. Which muscle is most likely involved?","o":["Medial pterygoid","Lateral pterygoid","Temporalis","Masseter"],"a":0},{"n":22,"q":"A patient develops weakness in all four pairs of muscles responsible for mandibular movement. Which nerve division supplies these muscles?","o":["Facial nerve","Maxillary division of trigeminal nerve","Mandibular division of trigeminal nerve","Accessory nerve"],"a":2},{"n":23,"q":"A patient is asked to rotate the head to the left against resistance. The right sternocleidomastoid contracts strongly. Which additional movement is expected from unilateral contraction of this muscle?","o":["Lateral flexion of the head to the left","Lateral flexion of the head to the right","Rotation of the head to the right","Extension of the cervical vertebral column only"],"a":1},{"n":24,"q":"A patient has bilateral weakness of the sternocleidomastoid muscles. Which combined movement would be most affected?","o":["Flexion of the cervical portion of the vertebral column","Extension of the lumbar vertebral column","Elevation of the mandible","Depression of the scapula"],"a":0},{"n":25,"q":"A patient has difficulty depressing the mandible and pulling the lower facial skin inferiorly during a pouting expression. Which muscle's actions best match these findings?","o":["Platysma","Masseter","Temporalis","Zygomaticus major"],"a":0},{"n":26,"q":"During abdominal surgery, a muscle is encountered immediately beneath the superficial external abdominal oblique layer and above the deepest transverse layer. Which muscle is being examined?","o":["Rectus abdominis","Internal abdominal oblique","Transversus abdominis","Quadratus lumborum"],"a":1},{"n":27,"q":"A patient has difficulty compressing abdominal contents during forced exhalation. Examination reveals weakness in the deepest anterolateral abdominal muscle, whose fascicles run perpendicular to the midline. Which muscle is involved?","o":["External abdominal oblique","Internal abdominal oblique","Rectus abdominis","Transversus abdominis"],"a":3},{"n":28,"q":"A patient is asked to perform a trunk curl from the supine position. The main muscle responsible originates from the pubic crest and pubic symphysis and inserts into the costal cartilages of ribs 5–7 and xiphoid process. Identify it.","o":["Rectus abdominis","External abdominal oblique","Quadratus lumborum","Transversus abdominis"],"a":0},{"n":29,"q":"A patient has difficulty rotating the vertebral column and laterally flexing the lumbar region. The affected muscle has fascicles running diagonally relative to the midline and originates from ribs 5–12. Which muscle is most likely involved?","o":["Rectus abdominis","External abdominal oblique","Transversus abdominis","Quadratus lumborum"],"a":1},{"n":30,"q":"A patient demonstrates weakness in abdominal compression and trunk rotation. The affected muscle originates from the iliac crest, inguinal ligament, and linea alba. Which muscle is most likely involved?","o":["Internal abdominal oblique","Rectus abdominis","Diaphragm","Quadratus lumborum"],"a":0},{"n":31,"q":"During forced exhalation, a patient cannot effectively pull the 12th ribs inferiorly. Which muscle is particularly important for this action?","o":["Diaphragm","Quadratus lumborum","External intercostals","Pectoralis major"],"a":1},{"n":32,"q":"A patient has weakness in a muscle that stabilizes the 12th ribs to prevent their elevation during deep inspiration. Which muscle is involved?","o":["Quadratus lumborum","Internal intercostals","Rectus abdominis","External abdominal oblique"],"a":0},{"n":33,"q":"A patient cannot adequately increase the vertical dimension of the thoracic cavity during inspiration. Which muscle is most likely impaired?","o":["Internal intercostals","Diaphragm","Transversus abdominis","Quadratus lumborum"],"a":1},{"n":34,"q":"During inspiration, the dome-shaped muscle contracts and moves inferiorly, increasing the vertical dimension of the thoracic cavity. Which nerve carries its motor supply?","o":["Accessory nerve","Thoracic spinal nerves T2–T12","Phrenic nerve","Dorsal scapular nerve"],"a":2},{"n":35,"q":"A patient sustains an injury affecting the cervical spinal nerve roots C3–C5. Which respiratory muscle is particularly at risk because of its innervation?","o":["External intercostals","Diaphragm","Internal intercostals","Quadratus lumborum"],"a":1},{"n":36,"q":"A patient has difficulty elevating the ribs during inspiration, leading to reduced anteroposterior and lateral dimensions of the thoracic cavity. Which muscles are most likely weakened?","o":["Internal intercostals","External intercostals","Quadratus lumborum","Rectus abdominis"],"a":1},{"n":37,"q":"During forced expiration, the patient cannot effectively draw adjacent ribs together to further decrease thoracic dimensions. Which muscle group is impaired?","o":["External intercostals","Diaphragm","Internal intercostals","Sternocleidomastoid"],"a":2},{"n":38,"q":"A surgeon identifies an opening in the diaphragm that allows the passage of a major vessel from the thoracic cavity into the abdominal cavity. Which statement is consistent with the chapter?","o":["The diaphragm contains openings for the aorta, esophagus, and inferior vena cava.","The diaphragm contains openings only for the aorta and trachea.","The diaphragm contains openings only for the esophagus and superior vena cava.","The diaphragm contains openings for the pulmonary arteries and bronchi."],"a":0},{"n":39,"q":"A patient has difficulty elevating the scapula and laterally flexing the neck toward the same side. Which muscle is most likely impaired?","o":["Rhomboid major","Levator scapulae","Trapezius","Deltoid"],"a":1},{"n":40,"q":"A patient can elevate the scapula but cannot adequately adduct it toward the vertebral column. The affected muscle originates from the spinous processes of T2–T5. Identify it.","o":["Rhomboid major","Levator scapulae","Serratus anterior","Trapezius superior fibers"],"a":0},{"n":41,"q":"A patient has weakness in a muscle originating from C7–T1 that inserts superior to the scapular spine along the vertebral border. Which muscle is involved?","o":["Rhomboid major","Rhomboid minor","Levator scapulae","Trapezius"],"a":1},{"n":42,"q":"Following an injury, a patient cannot effectively elevate and upwardly rotate the scapula using the superior fibers of a large posterior muscle. Which muscle is most likely affected?","o":["Trapezius","Rhomboid major","Levator scapulae","Latissimus dorsi"],"a":0},{"n":43,"q":"A patient has difficulty adducting the scapula and stabilizing it against the thoracic wall. Which muscle group performs both functions?","o":["Rhomboids","Deltoid","Pectoralis major","Supraspinatus"],"a":0},{"n":44,"q":"A patient presents with difficulty abducting the arm at the shoulder joint. The initial assistance in this movement is provided by a muscle arising from the supraspinous fossa. Which muscle is involved?","o":["Infraspinatus","Teres minor","Supraspinatus","Subscapularis"],"a":2},{"n":45,"q":"A patient can abduct the arm but demonstrates weakness during lateral rotation. The affected muscle arises from the infraspinous fossa and inserts into the greater tubercle. Which muscle is involved?","o":["Subscapularis","Infraspinatus","Teres major","Pectoralis major"],"a":1},{"n":46,"q":"A patient has difficulty medially rotating the arm at the shoulder joint. The affected muscle arises from the subscapular fossa and inserts into the lesser tubercle. Identify it.","o":["Teres minor","Infraspinatus","Subscapularis","Supraspinatus"],"a":2},{"n":47,"q":"A patient experiences weakness during lateral rotation and extension of the arm at the shoulder joint. The muscle involved arises from the infraspinous fossa and is supplied by the axillary nerve. Which muscle is affected?","o":["Teres minor","Infraspinatus","Teres major","Deltoid"],"a":0},{"n":48,"q":"A patient has difficulty extending the arm at the shoulder and assisting in adduction and medial rotation. The affected muscle originates from the inferior angle of the scapula. Which muscle is involved?","o":["Teres minor","Teres major","Supraspinatus","Subscapularis"],"a":1},{"n":49,"q":"A patient sustains an injury to the axillary nerve. Which shoulder muscle would be directly affected among the following?","o":["Supraspinatus","Infraspinatus","Deltoid","Subscapularis"],"a":2},{"n":50,"q":"A patient has difficulty abducting the arm using the lateral fibers of the deltoid. Which nerve injury would best explain the weakness?","o":["Suprascapular nerve","Axillary nerve","Thoracodorsal nerve","Medial pectoral nerve"],"a":1},{"n":51,"q":"A patient cannot effectively flex and medially rotate the arm using the anterior fibers of the deltoid. Which muscle region is involved?","o":["Posterior deltoid fibers","Anterior deltoid fibers","Lateral deltoid fibers","Middle trapezius fibers"],"a":1},{"n":52,"q":"A patient has difficulty extending and laterally rotating the arm at the shoulder joint. Which portion of the deltoid is primarily responsible?","o":["Anterior fibers","Lateral fibers","Posterior fibers","All fibers equally"],"a":2},{"n":53,"q":"A patient has weakness in a major shoulder muscle that adducts and medially rotates the arm and whose clavicular head also flexes it. Which muscle is involved?","o":["Latissimus dorsi","Pectoralis major","Deltoid","Teres minor"],"a":1},{"n":54,"q":"A swimmer experiences weakness while extending and adducting the arm at the shoulder. The muscle involved arises from the thoracolumbar fascia, lower thoracic and lumbar regions, sacrum, ilium, and lower ribs. Identify it.","o":["Pectoralis major","Deltoid","Latissimus dorsi","Teres major"],"a":2},{"n":55,"q":"An injury affects the nerve supplying a large axial muscle responsible for extending and adducting the arm. Which nerve is most likely involved?","o":["Axillary nerve","Thoracodorsal nerve","Suprascapular nerve","Dorsal scapular nerve"],"a":1},{"n":56,"q":"A patient has weakness in the muscle group that forms a cuff around the head of the humerus and stabilizes the shoulder joint. Which group is affected?","o":["Deltoid, pectoralis major, latissimus dorsi, and teres major","Supraspinatus, i lved?","o":["Adductor longus","Gluteus medius","Sartorius","Rectus femoris"],"a":0},{"n":78,"q":"A patient demonstrates weakness in thigh adduction and flexion. The affected muscle is the shorter member of a similarly named medial thigh muscle pair. Which muscle is involved?","o":["Adductor longus","Adductor brevis","Adductor magnus","Gracilis"],"a":1},{"n":79,"q":"A patient has difficulty adducting the thigh. However, the most distinctive finding is weakness in the posterior portion of a large medial thigh muscle that normally extends the thigh at the hip. Which muscle is involved?","o":["Adductor brevis","Adductor longus","Adductor magnus","Pectineus"],"a":2},{"n":80,"q":"A patient sustains an injury to the obturator nerve. Which group of muscles is most directly affected?","o":["Gluteus maximus and gluteus medius","Adductor longus and adductor brevis","Iliacus and psoas major","Rectus femoris and sartorius"],"a":1},{"n":81,"q":"A patient has difficulty extending the knee. The affected muscle group consists of four heads, all of which insert through the quadriceps tendon and patellar ligament. Which group is involved?","o":["Hamstrings","Quadriceps femoris","Adductor group","Gluteal group"],"a":1},{"n":82,"q":"A patient has weakness in knee extension and an additional difficulty flexing the thigh at the hip. Which quadriceps muscle explains both deficits?","o":["Vastus lateralis","Vastus medialis","Vastus intermedius","Rectus femoris"],"a":3},{"n":83,"q":"A patient has weakness in knee extension. The affected muscle originates from the greater trochanter and linea aspera of the femur. Which muscle is involved?","o":["Vastus lateralis","Vastus medialis","Rectus femoris","Sartorius"],"a":0},{"n":84,"q":"A patient has weakness in knee extension. The affected muscle arises from the anterior and lateral surfaces of the femoral body. Identify it.","o":["Vastus lateralis","Vastus medialis","Vastus intermedius","Rectus femoris"],"a":2},{"n":85,"q":"A patient has weakness const B6=[{"n":1,"q":"A 10-year-old child is evaluated for normal growth of the humerus. Imaging shows a layer of hyaline cartilage located between the shaft and the end of the bone. Which structure is responsible for allowing continued lengthwise growth?","o":["Periosteum","Epiphyseal plate","Endosteum","Articular cartilage"],"a":1},{"n":2,"q":"A 22-year-old patient undergoes an X-ray that shows a bony structure separating the shaft from the proximal end of the humerus. The structure represents the remnant of a cartilage plate that has been replaced by bone. What is it called?","o":["Metaphysis","Epiphyseal plate","Epiphyseal line","Medullary cavity"],"a":2},{"n":3,"q":"A patient sustains a fracture of the shaft of a long bone. During healing, cells in the inner layer of the surrounding membrane participate in formation of new bone. Which cells are primarily responsible for initiating this process?","o":["Osteocytes","Osteoclasts","Osteoprogenitor cells","Chondrocytes"],"a":2},{"n":4,"q":"A 19-year-old patient has reached skeletal maturity. A biopsy is taken from the shaft of the humerus. Which combination best describes the normal structure of the diaphysis?","o":["Mostly spongy bone surrounding a small medullary cavity","Compact bone surrounding a central medullary cavity","Cartilage surrounding a central osteon","Spongy bone containing numerous Haversian canals"],"a":1},{"n":5,"q":"A patient undergoes surgery involving the proximal end of the femur. Histological examination shows mostly spongy bone surrounded by a thin layer of compact bone. Which region is being examined?","o":["Diaphysis","Epiphysis","Metaphysis","Medullary cavity"],"a":1},{"n":6,"q":"A patient has a lesion affecting the membrane lining the internal cavity of a long bone. The membrane normally contains a single layer of bone-forming cells and a small amount of connective tissue. Which structure is affected?","o":["Periosteum","Endosteum","Articular cartilage","Epiphyseal plate"],"a":1},{"n":7, st activity and promote deposition of calcium in bone matrix. Which hormone is involved?","o":["PTH","Calcitriol","Calcitonin","Hydroxyapatite"],"a":2},{"n":28,"q":"A patient has impaired function of osteocytes in a region of compact bone. Despite this, blood vessels remain intact within the central canal. Which structures normally provide routes through which nutrients and oxygen can reach osteocytes from the osteonic canals?","o":["Trabeculae","Canaliculi","Sharpey’s fibers","Epiphyseal plates"],"a":1},{"n":29,"q":"A patient undergoes examination of the humerus. The physician identifies a region between the diaphysis and epiphysis. In a growing child, this region contains the epiphyseal plate. What is the region called?","o":["Medullary cavity","Metaphysis","Periosteum","Osteon"],"a":1},{"n":30,"q":"A patient has a disorder that significantly reduces the ability of bone to store calcium. The physician explains that bone normally serves as the body’s major calcium reservoir and participates in calcium homeostasis. Approximately what percentage of total body calcium is stored in bone?","o":["25%","50%","75%","99%"],"a":3}];

s the muscle fiber through ligand-gated channels","Voltage-gated calcium channels open in the neuronal synaptic end bulb","Tropomyosin moves across the neuronal membrane","Myosin binds directly to acetylcholine"],"a":1},{"n":23,"q":"A toxin selectively blocks voltage-gated calcium channels in the synaptic end bulbs of somatic motor neurons. Which immediate consequence is most likely?","o":["Increased calcium influx into the neuronal end bulb","Immediate movement of tropomyosin away from actin","Increased acetylcholine release into the synaptic cleft","Reduced neurotransmitter exocytosis into the synaptic cleft"],"a":3},{"n":24,"q":"A laboratory experiment demonstrates that neurotransmitter is released normally into the synaptic cleft. However, the neurotransmitter cannot activate its receptors on the skeletal muscle fiber. Which specialized region normally receives the neuronal signal?","o":["Motor end plate","M line","Z disc","H zone"],"a":0},{"n":25,"q":"A patient has a disorder that prevents acetylcholine from binding to the ligand-gated sodium channels on the motor end plate. Which immediate physiological event is most directly impaired?","o":["Calcium binding to troponin","Myosin attachment to titin","Sodium influx into the muscle fiber","Acetylcholine synthesis in the neuronal cell body"],"a":2},{"n":26,"q":"A researcher blocks sodium entry through ligand-gated channels at the motor end plate. Which sequence of events is most directly interrupted?","o":["Actin shortening → thick filament formation → calcium synthesis","Sodium influx → muscle membrane depolarization → subsequent calcium release from the sarcoplasmic reticulum","Calcium release → acetylcholine exocytosis → neuronal depolarization","Tropomyosin movement → neuronal calcium influx → acetylcholine breakdown"],"a":1},{"n":27,"q":"A patient has normal neuronal calcium influx and normal acetylcholine release. Nevertheless, the neurotransmitter remains in the synaptic cleft longer than expected because "Binding of acetylcholine to neuronal voltage-gated calcium channels","The link between muscle membrane depolarization and calcium release from the sarcoplasmic reticulum","Binding of tropomyosin to acetylcholinesterase"],"a":2},{"n":33,"q":"A patient undergoes an experiment in which skeletal muscle contraction is initiated successfully. Investigators observe that thin filaments move inward as myosin pulls on actin. Which structural change is expected?","o":["The Z discs move toward each other","The Z discs move farther apart","The sarcomere length increases","The thin filaments become thick filaments"],"a":0},{"n":34,"q":"During contraction, a researcher measures the distance between the two Z discs of a sarcomere. The distance decreases as the muscle develops tension. Which interpretation is most accurate?","o":["The sarcomere is lengthening because actin moves outward","The sarcomere is shortening because thin filaments slide inward","The sarcomere is shortening because actin is converted into myosin","The sarcomere is lengthening because myosin heads detach permanently"],"a":1},{"n":35,"q":"A muscle biopsy demonstrates intact actin and myosin, but the force generated by individual myofibrils is not effectively transmitted through the muscle. Which function of structural proteins is most relevant to this finding?","o":["Breaking down acetylcholine in the synaptic cleft","Producing calcium ions in the neuronal end bulb","Covering actin’s myosin-binding sites during relaxation","Maintaining filament alignment and transmitting force through the muscle"],"a":3},{"n":36,"q":"A patient has normal actin-myosin interactions, but serial measurements reveal that the sarcomere does not shorten normally. Which observation would be most consistent with the normal sliding filament mechanism?","o":["Thick and thin filaments both disappear during contraction","Myosin pulls actin inward, bringing the Z discs closer together","Z discs move apart as myosin pulls actin outward","Actin becomes the structural protein connecting the Z disc to the M line"],"a":0},{"n":37,"q":"A researcher compares a relaxed skeletal muscle sarcomere with one undergoing active contraction. Which change is specifically associated with the contraction process described in the chapter?","o":["The I band and H zone change as the sarcomere shortens","The myosin-binding sites on actin remain permanently covered","The Z discs move farther apart","The thick filaments are converted into thin filaments"],"a":0},{"n":38,"q":"A patient develops muscle weakness due to a defect in the transmission of force from myofibrils to surrounding structures. Which combination of functions normally helps prevent this problem?","o":["Acetylcholine synthesis and sodium storage in synaptic vesicles","Troponin-mediated neurotransmitter breakdown and calcium exocytosis","Structural protein support, filament alignment, and linkage to the sarcolemma and extracellular matrix","Permanent binding of tropomyosin to myosin heads"],"a":2},{"n":39,"q":"A muscle fiber receives a normal neural signal, releases calcium, and exposes the myosin-binding sites on actin. Nevertheless, the thin filaments fail to slide inward because myosin cannot interact normally with actin. Which event is most directly impaired?","o":["Acetylcholine degradation","Cross-bridge interaction between myosin heads and actin","Calcium entry into the neuronal end bulb","Formation of acetylcholine receptors at the motor end plate"],"a":1},{"n":40,"q":"A researcher observes that the sarcomere shortens while the thick and thin filaments remain identifiable as separate filament types. Which mechanism best explains this observation?","o":["Thick filaments dissolve and are resynthesized as thin filaments","Thin filaments contract independently of myosin","Titin converts the Z disc into the M line","Myosin pulls actin inward, causing the filaments to slide relative to one another"],"a":3},{"n":41,"q":"A patient has impaired skeletal muscle c
